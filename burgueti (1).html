<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burgueti - Control de Ventas y Gastos</title>
<style>
:root{
  --bg:#faf7f2; --card:#fff; --text:#2a1e14; --muted:#8a7565; --border:#eee0d3;
  --accent:#d9481f; --accent2:#2f8f4e; --danger:#c0392b; --shadow:0 2px 10px rgba(0,0,0,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#181310; --card:#241d18; --text:#f3ece4; --muted:#a5927f; --border:#3a2f26; --shadow:0 2px 10px rgba(0,0,0,.4);}
}
:root[data-theme="dark"]{ --bg:#181310; --card:#241d18; --text:#f3ece4; --muted:#a5927f; --border:#3a2f26; --shadow:0 2px 10px rgba(0,0,0,.4);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px;}
header{position:sticky;top:0;padding:env(safe-area-inset-top,0px) 16px 10px;background:var(--accent);color:#fff;z-index:5;}
header h1{margin:10px 0 2px;font-size:1.25rem;}
header p{margin:0;font-size:.8rem;opacity:.9;}
nav{display:flex;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);}
nav button{flex:1;padding:10px 4px;background:none;border:none;color:var(--muted);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;}
nav button.active{color:var(--accent);font-weight:700;}
nav button span{font-size:1.2rem;}
main{max-width:640px;margin:0 auto;padding:14px;}
.view{display:none;} .view.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;}
.stat b{display:block;font-size:1.3rem;}
.stat span{font-size:.72rem;color:var(--muted);}
.pos{color:var(--accent2)} .neg{color:var(--danger)}
label{font-size:.78rem;color:var(--muted);display:block;margin:8px 0 4px;}
select,input,textarea{width:100%;padding:9px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.95rem;}
button.btn{background:var(--accent);color:#fff;border:none;padding:11px;border-radius:10px;font-size:.95rem;font-weight:600;width:100%;margin-top:10px;}
button.btn.secondary{background:var(--accent2);}
button.btn.ghost{background:transparent;color:var(--danger);border:1px solid var(--border);padding:6px 10px;width:auto;margin:0;font-size:.75rem;}
h2{font-size:1rem;margin:0 0 8px;}
h3{font-size:.85rem;color:var(--muted);margin:14px 0 6px;}
.itemrow{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.itemrow select{flex:2;} .itemrow input{flex:1;}
.itemrow button{background:var(--border);border:none;border-radius:8px;width:34px;height:34px;color:var(--text);}
.linetot{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:.85rem;}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.85rem;gap:8px;}
.hist small{color:var(--muted);display:block;}
.tag{font-size:.65rem;padding:2px 7px;border-radius:20px;background:var(--border);}
.bar{height:8px;border-radius:6px;background:var(--border);overflow:hidden;margin:4px 0 10px;}
.bar i{display:block;height:100%;background:var(--accent);}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:.85rem;}
</style>
</head>
<body>
<header>
  <h1>🍔 Burgueti</h1>
  <p>Control de ventas y gastos · jue–dom 5pm–9pm</p>
</header>

<main>
  <!-- DASHBOARD -->
  <section id="v-dash" class="view active">
    <div class="card">
      <label>Rango de fechas</label>
      <div class="grid2">
        <input type="date" id="fDesde">
        <input type="date" id="fHasta">
      </div>
      <div class="grid2" style="margin-top:8px">
        <button class="btn secondary" onclick="setRango('semana')">Esta semana</button>
        <button class="btn" onclick="setRango('todo')" style="background:var(--muted)">Todo</button>
      </div>
    </div>
    <div class="grid2" style="margin-bottom:12px">
      <div class="stat"><b id="dVentas">$0</b><span>Ventas totales</span></div>
      <div class="stat"><b id="dCosto">$0</b><span>Costo de productos</span></div>
      <div class="stat"><b id="dGastos">$0</b><span>Gastos operativos</span></div>
      <div class="stat"><b id="dGanancia">$0</b><span>Ganancia neta</span></div>
    </div>
    <div class="card">
      <h2>Margen neto: <span id="dMargen">0%</span></h2>
      <div class="bar"><i id="dMargenBar" style="width:0%"></i></div>
      <h3>Ventas por día</h3>
      <div id="dPorDia"></div>
    </div>
  </section>

  <!-- VENTA -->
  <section id="v-venta" class="view">
    <div class="card">
      <h2>Registrar venta</h2>
      <label>Fecha</label>
      <input type="date" id="ventaFecha">
      <h3>Productos vendidos</h3>
      <div id="ventaItems"></div>
      <button class="btn secondary" onclick="addItemRow()">+ Agregar producto</button>
      <div style="margin-top:12px">
        <div class="linetot"><span>Total venta</span><b id="vTotal">$0.00</b></div>
        <div class="linetot"><span>Costo</span><b id="vCosto">$0.00</b></div>
        <div class="linetot"><span>Ganancia</span><b id="vGan">$0.00</b></div>
      </div>
      <label>Nota (opcional)</label>
      <input id="ventaNota" placeholder="Ej: pedido a domicilio">
      <button class="btn" onclick="guardarVenta()">Guardar venta</button>
    </div>
  </section>

  <!-- GASTO -->
  <section id="v-gasto" class="view">
    <div class="card">
      <h2>Registrar gasto</h2>
      <label>Fecha</label>
      <input type="date" id="gastoFecha">
      <label>Categoría</label>
      <select id="gastoCat">
        <option>Insumos / ingredientes</option>
        <option>Gas / combustible</option>
        <option>Empaques y desechables</option>
        <option>Servicios (luz, agua, internet)</option>
        <option>Personal / sueldos</option>
        <option>Alquiler / local</option>
        <option>Marketing</option>
        <option>Mantenimiento / equipos</option>
        <option>Otros</option>
      </select>
      <label>Descripción</label>
      <input id="gastoDesc" placeholder="Ej: compra de carne y pan">
      <label>Monto ($)</label>
      <input type="number" step="0.01" id="gastoMonto" placeholder="0.00">
      <button class="btn" onclick="guardarGasto()">Guardar gasto</button>
    </div>
  </section>

  <!-- HISTORIAL -->
  <section id="v-hist" class="view">
    <div class="card">
      <h2>Historial</h2>
      <button class="btn secondary" onclick="exportExcel()">📥 Descargar respaldo en Excel</button>
      <div id="histList" style="margin-top:10px"></div>
    </div>
  </section>
</main>

<nav>
  <button class="navbtn active" data-v="v-dash" onclick="showView('v-dash',this)"><span>📊</span>Resumen</button>
  <button class="navbtn" data-v="v-venta" onclick="showView('v-venta',this)"><span>💰</span>Venta</button>
  <button class="navbtn" data-v="v-gasto" onclick="showView('v-gasto',this)"><span>🧾</span>Gasto</button>
  <button class="navbtn" data-v="v-hist" onclick="showView('v-hist',this)"><span>📜</span>Historial</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ---- Catálogo extraído de PRECIOS_BURGUETI_OFICIAL.xlsm (hoja PVP) ----
const PRODUCTOS = [
  {id:'clasica',cat:'Hamburguesas',nom:'Hamburguesa Clásica',costo:2.13,pvp:3.5},
  {id:'burgueti',cat:'Hamburguesas',nom:'Hamburguesa Burgueti',costo:2.25,pvp:4.5},

  {id:'baconx2',cat:'Hamburguesas',nom:'Doble Bacon House',costo:2.78,pvp:5.5},
  {id:'hawaiana',cat:'Hamburguesas',nom:'Hawaiana',costo:2.11,pvp:4.5},
  {id:'papas',cat:'Extras',nom:'Papas (solas)',costo:0.5,pvp:1.25},
  {id:'cola',cat:'Extras',nom:'Cola (sola)',costo:0.25,pvp:0.5},
  {id:'c_clasica',cat:'Combos (1 hamb+papas+cola)',nom:'Combo Clásica',costo:3.08,pvp:4.75},
  {id:'c_burgueti',cat:'Combos (1 hamb+papas+cola)',nom:'Combo Burgueti',costo:3.20,pvp:5.75},
  {id:'c_bacon',cat:'Combos (1 hamb+papas+cola)',nom:'Combo Bacon House',costo:3.05,pvp:5.75},
  {id:'c_ranch',cat:'Combos (1 hamb+papas+cola)',nom:'Combo La Ranch',costo:3.38,pvp:5.75},
  {id:'c_baconx2',cat:'Combos (1 hamb+papas+cola)',nom:'Combo Doble Bacon House',costo:3.53,pvp:6.75},
  {id:'c_hawaiana',cat:'Combos (1 hamb+papas+cola)',nom:'Combo Hawaiana',costo:3.06,pvp:5.75},
  {id:'cd_bacon_ranch',cat:'Combos dobles (2+2+2)',nom:'Doble Bacon+Ranch (2 hamb,2 papas,2 colas)',costo:6.43,pvp:10.99},
  {id:'cd_burgueti_bacon',cat:'Combos dobles (2+2+2)',nom:'Burgueti+Bacon (2 hamb,2 papas,2 colas)',costo:6.25,pvp:9.99},
  {id:'p_clasica_burgueti',cat:'Promos',nom:'Promo Clásica + Burgueti',costo:5.78,pvp:8.5},
  {id:'p_clasica_ranch_cola',cat:'Promos',nom:'Promo Clásica + Ranch + Cola',costo:6.46,pvp:8.99},
  {id:'p_baconx2_burgueti',cat:'Promos',nom:'Promo Doble Bacon + Burgueti',costo:6.23,pvp:9.99},
  {id:'p_baconx2_clasica_cola',cat:'Promos',nom:'Promo Doble Bacon + Clásica + Cola',costo:6.61,pvp:9.99},
  {id:'p_baconx2_ranch',cat:'Promos',nom:'Promo Doble Bacon + Ranch',costo:6.41,pvp:9.5},
  {id:'p_clasica_crispyranch',cat:'Promos',nom:'Promo Clásica + Crispy Ranch',costo:5.96,pvp:7.99},
  {id:'p_burgueti_ranch_cola',cat:'Promos',nom:'Promo Burgueti + Ranch + Cola',costo:6.58,pvp:9.99},
  {id:'p_bacon_ranch',cat:'Promos',nom:'Promo Bacon + Ranch',costo:6.58,pvp:9.5},
  {id:'p_bacon_clasica',cat:'Promos',nom:'Promo Bacon + Clásica',costo:5.93,pvp:8.5},
  // --- Combos dobles con 2 papas + 2 colas ---
  {id:'cd_hawaiana_clasica',cat:'Combos dobles (2 papas+2 colas)',nom:'Hawaiana + Clásica + 2 papas + 2 colas',costo:5.74,pvp:9.5},
  {id:'cd_bacon_ranch2',cat:'Combos dobles (2 papas+2 colas)',nom:'Bacon House + Ranch + 2 papas + 2 colas',costo:6.03,pvp:10.99},
  {id:'cd_burgueti_ranch',cat:'Combos dobles (2 papas+2 colas)',nom:'Burgueti + Ranch + 2 papas + 2 colas',costo:6.18,pvp:10.99},
  {id:'cd_bacon_hawaiana',cat:'Combos dobles (2 papas+2 colas)',nom:'Bacon House + Hawaiana + 2 papas + 2 colas',costo:5.71,pvp:10.99},
  // --- Combos dobles solo con 2 colas (sin papas) ---
  {id:'cd_ranch_clasica_cola',cat:'Combos dobles (2 colas, sin papas)',nom:'Ranch + Clásica + 2 colas',costo:5.06,pvp:8.5},
  {id:'cd_clasica_burgueti_cola',cat:'Combos dobles (2 colas, sin papas)',nom:'Clásica + Burgueti + 2 colas',costo:4.88,pvp:7.99},
  {id:'cd_bacon_burgueti_cola',cat:'Combos dobles (2 colas, sin papas)',nom:'Bacon House + Burgueti + 2 colas',costo:4.85,pvp:8.99},
  {id:'cd_clasica_hawaiana_cola',cat:'Combos dobles (2 colas, sin papas)',nom:'Clásica + Hawaiana + 2 colas',costo:4.74,pvp:8.5},
  {id:'cd_clasica_bacon_cola',cat:'Combos dobles (2 colas, sin papas)',nom:'Clásica + Bacon House + 2 colas',costo:4.73,pvp:8.5},
  {id:'cd_ranch_bacon_cola',cat:'Combos dobles (2 colas, sin papas)',nom:'Ranch + Bacon House + 2 colas',costo:5.03,pvp:9.5},
  {id:'cd_hawaiana_burgueti_cola',cat:'Combos dobles (2 colas, sin papas)',nom:'Hawaiana + Burgueti + 2 colas',costo:4.86,pvp:8.5},
  {id:'cd_bacon_hawaiana_cola',cat:'Combos dobles (2 colas, sin papas)',nom:'Bacon House + Hawaiana + 2 colas',costo:4.71,pvp:9.5},
  {id:'cd_ranch_burgueti_cola',cat:'Combos dobles (2 colas, sin papas)',nom:'Ranch + Burgueti + 2 colas',costo:5.18,pvp:8.99},
  // --- Combos grandes (3+ hamburguesas, cola 1 litro) ---
  {id:'cg_hawaiana_clasica_bacon',cat:'Combos grandes (cola 1L)',nom:'Hawaiana + Clásica + Bacon + 2 papas + cola 1L',costo:7.84,pvp:14.5},
  {id:'cg_ranch_clasica_bacon',cat:'Combos grandes (cola 1L)',nom:'Ranch + Clásica + Bacon + 2 papas + cola 1L',costo:8.16,pvp:14.5},
  {id:'cg_burgueti_2clasica_hawaiana_bacon',cat:'Combos grandes (cola 1L)',nom:'Burgueti + 2 Clásicas + Hawaiana + Bacon + 2 papas + cola 1L',costo:12.22,pvp:19.99},
  {id:'cg_burgueti_2clasica_ranch_bacon',cat:'Combos grandes (cola 1L)',nom:'Burgueti + 2 Clásicas + Ranch + Bacon + 2 papas + cola 1L',costo:12.54,pvp:19.99},
];
const byId = id => PRODUCTOS.find(p=>p.id===id);

// ---- storage ----
const LS_V='burgueti_ventas', LS_G='burgueti_gastos';
function load(k){ try{ return JSON.parse(localStorage.getItem(k))||[]; }catch(e){ return []; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let ventas = load(LS_V), gastos = load(LS_G);

// ---- nav ----
function showView(id,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(id==='v-dash') renderDash();
  if(id==='v-hist') renderHist();
}

// ---- fecha default ----
const hoy = new Date().toISOString().slice(0,10);
document.getElementById('ventaFecha').value = hoy;
document.getElementById('gastoFecha').value = hoy;

// ---- items de venta ----
function addItemRow(){
  const row = document.createElement('div'); row.className='itemrow';
  const cats = [...new Set(PRODUCTOS.map(p=>p.cat))];
  let opts = cats.map(c=>`<optgroup label="${c}">${PRODUCTOS.filter(p=>p.cat===c).map(p=>`<option value="${p.id}">${p.nom} ($${p.pvp.toFixed(2)})</option>`).join('')}</optgroup>`).join('');
  row.innerHTML = `<select onchange="calcVenta()">${opts}</select>
    <input type="number" min="1" value="1" onchange="calcVenta()" oninput="calcVenta()">
    <button onclick="this.parentElement.remove();calcVenta()">✕</button>`;
  document.getElementById('ventaItems').appendChild(row);
  calcVenta();
}
function calcVenta(){
  let total=0, costo=0;
  document.querySelectorAll('#ventaItems .itemrow').forEach(r=>{
    const id = r.querySelector('select').value;
    const qty = parseFloat(r.querySelector('input').value)||0;
    const p = byId(id);
    if(p){ total += p.pvp*qty; costo += p.costo*qty; }
  });
  document.getElementById('vTotal').textContent = '$'+total.toFixed(2);
  document.getElementById('vCosto').textContent = '$'+costo.toFixed(2);
  document.getElementById('vGan').textContent = '$'+(total-costo).toFixed(2);
}
addItemRow();

function guardarVenta(){
  const fecha = document.getElementById('ventaFecha').value;
  const nota = document.getElementById('ventaNota').value;
  const items = [];
  let total=0, costo=0;
  document.querySelectorAll('#ventaItems .itemrow').forEach(r=>{
    const id = r.querySelector('select').value;
    const qty = parseFloat(r.querySelector('input').value)||0;
    if(qty>0){ const p = byId(id); items.push({id,qty}); total+=p.pvp*qty; costo+=p.costo*qty; }
  });
  if(!items.length || !fecha){ alert('Agrega al menos un producto y una fecha.'); return; }
  ventas.push({id:Date.now(), fecha, items, total, costo, ganancia: total-costo, nota});
  save(LS_V, ventas);
  document.getElementById('ventaItems').innerHTML=''; addItemRow();
  document.getElementById('ventaNota').value='';
  alert('Venta guardada ✅');
  showView('v-dash', document.querySelector('[data-v="v-dash"]'));
}

function guardarGasto(){
  const fecha = document.getElementById('gastoFecha').value;
  const cat = document.getElementById('gastoCat').value;
  const desc = document.getElementById('gastoDesc').value;
  const monto = parseFloat(document.getElementById('gastoMonto').value);
  if(!fecha || !monto || monto<=0){ alert('Completa fecha y monto válido.'); return; }
  gastos.push({id:Date.now(), fecha, cat, desc, monto});
  save(LS_G, gastos);
  document.getElementById('gastoDesc').value=''; document.getElementById('gastoMonto').value='';
  alert('Gasto guardado ✅');
  showView('v-dash', document.querySelector('[data-v="v-dash"]'));
}

// ---- dashboard ----
function setRango(tipo){
  const hoyD = new Date();
  if(tipo==='semana'){
    const d = new Date(hoyD); const diff = (d.getDay()+7-1)%7; // lunes
    d.setDate(d.getDate()-diff);
    document.getElementById('fDesde').value = d.toISOString().slice(0,10);
    document.getElementById('fHasta').value = hoyD.toISOString().slice(0,10);
  } else {
    document.getElementById('fDesde').value=''; document.getElementById('fHasta').value='';
  }
  renderDash();
}
document.getElementById('fDesde').addEventListener('change', renderDash);
document.getElementById('fHasta').addEventListener('change', renderDash);

function inRango(fecha){
  const d = document.getElementById('fDesde').value, h = document.getElementById('fHasta').value;
  if(d && fecha < d) return false;
  if(h && fecha > h) return false;
  return true;
}

function renderDash(){
  const vs = ventas.filter(v=>inRango(v.fecha));
  const gs = gastos.filter(g=>inRango(g.fecha));
  const tVentas = vs.reduce((s,v)=>s+v.total,0);
  const tCosto = vs.reduce((s,v)=>s+v.costo,0);
  const tGastos = gs.reduce((s,g)=>s+g.monto,0);
  const ganNeta = tVentas - tCosto - tGastos;
  document.getElementById('dVentas').textContent = '$'+tVentas.toFixed(2);
  document.getElementById('dCosto').textContent = '$'+tCosto.toFixed(2);
  document.getElementById('dGastos').textContent = '$'+tGastos.toFixed(2);
  const gEl = document.getElementById('dGanancia');
  gEl.textContent = '$'+ganNeta.toFixed(2);
  gEl.className = ganNeta>=0?'pos':'neg';
  const margen = tVentas>0 ? (ganNeta/tVentas*100) : 0;
  document.getElementById('dMargen').textContent = margen.toFixed(1)+'%';
  document.getElementById('dMargenBar').style.width = Math.max(0,Math.min(100,margen))+'%';

  // por día
  const dias = {};
  vs.forEach(v=>{ dias[v.fecha]=dias[v.fecha]||{v:0,c:0}; dias[v.fecha].v+=v.total; dias[v.fecha].c+=v.costo; });
  gs.forEach(g=>{ dias[g.fecha]=dias[g.fecha]||{v:0,c:0}; dias[g.fecha].g=(dias[g.fecha].g||0)+g.monto; });
  const dEl = document.getElementById('dPorDia');
  const keys = Object.keys(dias).sort().reverse();
  if(!keys.length){ dEl.innerHTML='<div class="empty">Aún no hay ventas registradas en este rango.</div>'; }
  else dEl.innerHTML = keys.map(k=>{
    const d = dias[k]; const g = d.g||0; const gan = d.v-d.c-g;
    return `<div class="hist"><div><b>${k}</b><small>Ventas $${d.v.toFixed(2)} · Gastos $${g.toFixed(2)}</small></div><b class="${gan>=0?'pos':'neg'}">$${gan.toFixed(2)}</b></div>`;
  }).join('');
}

// ---- historial ----
function renderHist(){
  const all = [
    ...ventas.map(v=>({...v,tipo:'venta'})),
    ...gastos.map(g=>({...g,tipo:'gasto'}))
  ].sort((a,b)=> b.fecha.localeCompare(a.fecha) || b.id-a.id);
  const el = document.getElementById('histList');
  if(!all.length){ el.innerHTML = '<div class="empty">No hay movimientos aún.</div>'; return; }
  el.innerHTML = all.map(item=>{
    if(item.tipo==='venta'){
      const desc = item.items.map(i=>`${i.qty}x ${byId(i.id)?byId(i.id).nom:'?'}`).join(', ');
      return `<div class="hist"><div><span class="tag" style="background:#d9481f22;color:var(--accent)">Venta</span> <b>${item.fecha}</b><small>${desc}${item.nota?' · '+item.nota:''}</small></div>
      <div style="text-align:right"><b class="pos">+$${item.total.toFixed(2)}</b><br><button class="btn ghost" onclick="borrar('venta',${item.id})">borrar</button></div></div>`;
    } else {
      return `<div class="hist"><div><span class="tag" style="background:#c0392b22;color:var(--danger)">Gasto</span> <b>${item.fecha}</b><small>${item.cat}${item.desc?' · '+item.desc:''}</small></div>
      <div style="text-align:right"><b class="neg">-$${item.monto.toFixed(2)}</b><br><button class="btn ghost" onclick="borrar('gasto',${item.id})">borrar</button></div></div>`;
    }
  }).join('');
}
function borrar(tipo,id){
  if(!confirm('¿Eliminar este registro?')) return;
  if(tipo==='venta'){ ventas = ventas.filter(v=>v.id!==id); save(LS_V,ventas); }
  else { gastos = gastos.filter(g=>g.id!==id); save(LS_G,gastos); }
  renderHist(); renderDash();
}

renderDash();

async function exportExcel(){
  if(typeof XLSX==='undefined'){ alert('No se pudo cargar la librería de Excel. Revisa tu conexión.'); return; }
  const wsVentas = XLSX.utils.json_to_sheet(ventas.map(v=>({
    Fecha:v.fecha,
    Productos:v.items.map(i=>`${i.qty}x ${byId(i.id)?byId(i.id).nom:i.id}`).join(', '),
    Total:Number(v.total.toFixed(2)), Costo:Number(v.costo.toFixed(2)), Ganancia:Number(v.ganancia.toFixed(2)),
    Nota:v.nota||''
  })));
  const wsGastos = XLSX.utils.json_to_sheet(gastos.map(g=>({
    Fecha:g.fecha, Categoria:g.cat, Descripcion:g.desc||'', Monto:Number(g.monto.toFixed(2))
  })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsVentas, 'Ventas');
  XLSX.utils.book_append_sheet(wb, wsGastos, 'Gastos');
  const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const filename = `burgueti_respaldo_${hoy}.xlsx`;

  let dl = null;
  try{ dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
  if(dl){
    try{ await dl.save({filename, data: blob}); }
    catch(e){ alert('No se pudo guardar el archivo: '+((e&&e.message)||e)); }
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
}
</script>
